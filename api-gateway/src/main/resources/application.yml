server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: StripPrefix
              args:
                parts: 0

        - id: link-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/links/**
          filters:
            - name: StripPrefix
              args:
                parts: 0
            - name: AuthFilter

jwt:
  secret: ${JWT_SECRET:your-very-long-secret-key-at-least-64-characters-long-1234567890abcdefghijklmnopqrstuvwxyz}
  expiration: ${JWT_EXPIRATION:86400000}