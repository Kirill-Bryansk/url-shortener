server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: StripPrefix
              args:
                parts: 0

        - id: link-service
          uri: lb://link-service
          predicates:
            - Path=/api/v1/links/**
          filters:
            - name: StripPrefix
              args:
                parts: 0
            - name: AuthFilter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    instance:
      prefer-ip-address: true
jwt:
  secret: ${JWT_SECRET:your-very-long-secret-key-at-least-64-characters-long-1234567890abcdefghijklmnopqrstuvwxyz}
  expiration: ${JWT_EXPIRATION:86400000}