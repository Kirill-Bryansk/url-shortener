server:
  port: 8082

spring:
  application:
    name: link-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/url_shortener
    username: postgres
    password: 12345
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
